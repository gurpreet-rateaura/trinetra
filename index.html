<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trinetra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fafafa;--fg:#111;--m:#666;--bd:#e3e3e3;--cd:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--m:#999;--bd:#333;--cd:#1a1a1a}}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:980px;margin:auto;padding:16px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
h1{font-size:22px;margin:0;display:flex;gap:8px;align-items:center}h2{font-size:15px;margin:0 0 10px}
.m{color:var(--m)}label{display:block;font-size:12px;color:var(--m);margin:6px 0 2px}
input,select,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
textarea{font-family:ui-monospace,monospace;font-size:12px;min-height:90px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
button{padding:9px 14px;border-radius:8px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font:inherit;cursor:pointer;margin:6px 6px 0 0}
button.s{background:none;color:var(--fg);border-color:var(--bd)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.k div{border:1px solid var(--bd);border-radius:8px;padding:8px}.k b{display:block;font-size:20px}
</style></head><body><main>
<div id="L" class="c" style="max-width:380px;margin:12vh auto">
<h1>Trinetra</h1><p class="m">Hotel rate intelligence console</p>
<label>Worker URL</label><input id="wu" placeholder="https://trinetra.yourname.workers.dev">
<label>Password</label><input id="pw" type="password"><button id="lb">Login</button><span id="le" class="m"></span></div>

<div id="A" hidden>
<h1><svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 17C7 9 25 9 30 17C25 25 7 25 2 17Z"/><circle cx="16" cy="17" r="4.5" fill="currentColor"/><path d="M16 2v5"/></svg>Trinetra <button class="s" id="lo" style="margin-left:auto">Logout</button></h1>

<div class="c"><h2>1. Hotel static data</h2><input type="file" id="f" accept=".xlsx,.xls,.csv"><p id="us" class="m">Needs columns HotelId, HotelName, CountryName</p></div>

<div class="c"><h2>2. Purpose</h2><div class="g">
<div><label>Mode</label><select id="mode"><option value="map">Mapping exercise (base supplier)</option><option value="gen">General comparison</option></select></div>
<div><label>Base supplier</label><select id="b0"></select></div>
<div><label>Target difference % (lowers base price)</label><input id="tg" type="number" value="3" step="0.1"></div>
<div><label>Meal plans (comma list, blank = all)</label><input id="ml" placeholder="Room Only, Breakfast"></div></div></div>

<div class="c"><h2>3. API request</h2>
<div class="g"><div><label>Saved configs</label><select id="cfg"></select></div>
<div style="align-self:end"><button class="s" id="ld">Load</button><button class="s" id="sv">Save</button><button class="s" id="dl">Delete</button></div></div>
<label>Endpoint URL (POST)</label><input id="url" placeholder="https://apiout.rateaura.com/...">
<label>Headers JSON (no auth here, the Worker adds it)</label><textarea id="hd" style="min-height:50px">{"Content-Type":"application/json"}</textarea>
<label>Body template (HotelIDs, dates, nights, adults and nationality are replaced automatically)</label>
<textarea id="bd" style="min-height:200px">{"Request":{"Rooms":[{"RoomNo":1,"NoofAdults":2,"NoOfChild":0,"ChildAge":[]}],"CheckInDate":"","CheckOutDate":"","NoofNights":2,"Nationality":"","Filters":{"IsRecommendedOnly":0,"IsShowRooms":1,"IsOnlyAvailable":1,"StarRating":{"Min":0,"Max":0},"HotelIDs":""}},"AdvancedOptions":{"Currency":"USD","CustomerIpAddress":"667198","HotelName":"","searchKeyAgoda":null},"IsMobile":1,"IsSearch":1}</textarea></div>

<div class="c"><h2>4. Search and execution</h2><div class="g">
<div><label>Check-in from</label><input id="d1" type="date"></div>
<div><label>Check-in to (blank = single date)</label><input id="d2" type="date"></div>
<div><label>Step (days)</label><input id="st" type="number" value="1" min="1"></div>
<div><label>Nights (comma list)</label><input id="nt" value="2"></div>
<div><label>Adults</label><input id="ad" type="number" value="2" min="1"></div>
<div><label>Hotel IDs per call</label><input id="bs" type="number" value="10" min="1"></div>
<div><label>QPS (max call starts/sec)</label><input id="qps" type="number" value="2" step="0.5" min="0.1"></div>
<div><label>Timeout (seconds)</label><input id="to" type="number" value="3" step="0.5"></div>
<div><label>Nationality</label><select id="nm"><option value="fixed">Fixed</option><option value="hotel">Same as hotel country</option></select></div>
<div><label>Fixed nationality</label><select id="nf"></select></div>
<div><label>Date format</label><select id="df"><option>MM-DD-YYYY</option><option>DD-MM-YYYY</option></select></div></div>
<p id="est" class="m"></p></div>

<div class="c"><h2>Supplier master (id,name,active 1/0 per line)</h2><textarea id="sup" style="min-height:150px"></textarea></div>

<div class="c"><h2>5. Run</h2><button id="go">Start</button><button class="s" id="sp">Stop</button><button class="s" id="rt">Retry timeouts/failed</button><button class="s" id="xl">Download Excel</button>
<p id="pr" class="m"></p><div class="k" id="db"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),LS=localStorage,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const S0="4,ETG_WEB,1\n5,Dida,1\n6,Restel,1\n7,IOL_B2B,1\n8,IOL_CUG,1\n9,IOL_X3_B2B,1\n10,IOL_B2C,1\n11,ETG_OUT,1\n12,letsfly,1\n13,Hibeds_CUG,1\n14,GoGlobal_web,1\n15,GoGlobal_Out,1\n16,GoGlobal_B2c,1\n24,Expedia,1";
let W=LS.w||'',TOK=sessionStorage.t||'',H=[],HM={},JOBS=[],AGG={},stop=false;
function sup(id){const m={};$('#sup').value.split('\n').forEach(l=>{const [i,n,a]=l.split(',').map(x=>x.trim());if(i)m[i]={name:n,on:a!=='0'}});return m[id]||{name:'Unknown ('+id+')',on:true}}
function sups(){return $('#sup').value.split('\n').map(l=>l.split(',').map(x=>x.trim())).filter(x=>x[0])}
function fillBase(){const v=$('#b0').value||'5';$('#b0').innerHTML=sups().map(x=>`<option value="${x[0]}">${x[1]} (${x[0]})</option>`).join('');$('#b0').value=v}
function boot(){$('#L').hidden=!!TOK;$('#A').hidden=!TOK;$('#wu').value=W;$('#sup').value=LS.sup||S0;fillBase();cfgs()}
$('#lb').onclick=async()=>{W=$('#wu').value.trim().replace(/\/$/,'');LS.w=W;
const r=await fetch(W+'/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})}).catch(()=>0);
if(!r||!r.ok){$('#le').textContent=' Login failed';return}TOK=(await r.json()).token;sessionStorage.t=TOK;boot()};
$('#lo').onclick=()=>{sessionStorage.clear();TOK='';boot()};
$('#sup').onchange=()=>{LS.sup=$('#sup').value;fillBase()};
function cfgs(){const c=JSON.parse(LS.cfgs||'{}');$('#cfg').innerHTML=Object.keys(c).map(k=>`<option>${k}</option>`).join('')}
$('#sv').onclick=()=>{const n=prompt('Config name');if(!n)return;const c=JSON.parse(LS.cfgs||'{}');c[n]={u:$('#url').value,h:$('#hd').value,b:$('#bd').value};LS.cfgs=JSON.stringify(c);cfgs();$('#cfg').value=n};
$('#ld').onclick=()=>{const c=JSON.parse(LS.cfgs||'{}')[$('#cfg').value];if(c){$('#url').value=c.u;$('#hd').value=c.h;$('#bd').value=c.b}};
$('#dl').onclick=()=>{const c=JSON.parse(LS.cfgs||'{}');delete c[$('#cfg').value];LS.cfgs=JSON.stringify(c);cfgs()};
$('#f').onchange=async e=>{const wb=XLSX.read(await e.target.files[0].arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}),seen=new Set();let bad=0;H=[];HM={};
rows.forEach(r=>{const k={};for(const c in r)k[c.trim()]=r[c];const id=String(k.HotelId).trim(),co=String(k.CountryName).trim();
if(!/^\d+$/.test(id)||seen.has(id)||!co){bad++;return}seen.add(id);const h={id,name:k.HotelName,country:co};H.push(h);HM[id]=h});
const cs=[...new Set(H.map(h=>h.country))].sort();$('#nf').innerHTML=cs.map(c=>`<option>${c}</option>`).join('');
$('#us').textContent=`Total ${rows.length} | valid ${H.length} | invalid ${bad} (bad/duplicate ID or blank country) | countries ${cs.length}`;est()};
const fmt=d=>{const p=n=>String(n).padStart(2,'0'),m=p(d.getUTCMonth()+1),dd=p(d.getUTCDate());return $('#df').value==='MM-DD-YYYY'?`${m}-${dd}-${d.getUTCFullYear()}`:`${dd}-${m}-${d.getUTCFullYear()}`};
function build(){const n=+$('#bs').value,nts=$('#nt').value.split(',').map(Number).filter(Boolean),ds=[];
if($('#d1').value){const e=new Date($('#d2').value||$('#d1').value);for(let d=new Date($('#d1').value);d<=e;d.setUTCDate(d.getUTCDate()+ +$('#st').value))ds.push(new Date(d))}
const G={};H.forEach(h=>{const k=$('#nm').value==='fixed'?'_':h.country;(G[k]=G[k]||[]).push(h)});const J=[];
for(const d of ds)for(const nn of nts)for(const k in G)for(let i=0;i<G[k].length;i+=n)J.push({d,n:nn,nat:k==='_'?$('#nf').value:k,hs:G[k].slice(i,i+n),st:'pending',scn:fmt(d)+' / '+nn+'n / '+(k==='_'?$('#nf').value:k)});return J}
function est(){const n=build().length;$('#est').textContent=`${n} API calls | about ${Math.ceil(n/+$('#qps').value/60)} min at ${$('#qps').value} QPS`}
$('#A').addEventListener('input',est);
function body(j){const b=JSON.parse($('#bd').value),r=b.Request,o=new Date(j.d);o.setUTCDate(o.getUTCDate()+j.n);
r.CheckInDate=fmt(j.d);r.CheckOutDate=fmt(o);r.NoofNights=j.n;r.Nationality=j.nat;(r.Rooms||[]).forEach(x=>x.NoofAdults=+$('#ad').value);r.Filters=r.Filters||{};r.Filters.HotelIDs=j.hs.map(h=>h.id).join(',');return b}
function parse(j, x) {
  const a = x.AvailabilityRS;
  const cur = a.Currency;

  (a.HotelResult || []).forEach(h => {
    (h.HotelOption || []).forEach(o => {
      const sid = o.HotelOptionId.split('|')[2];

      (o.HotelRooms || []).forEach(c => {
        if (c.some(r => r.BookingStatus !== 'Available')) return;

        const p = c.reduce((s, r) => s + Math.round(r.Price * 100), 0);
        const r0 = c[0];
        const pol = r0.CancellationPolicy || [];

        const cls = !pol.length || pol[0].CancellationPrice > 0
          ? 'Non-refundable'
          : 'Refundable';

        const fr = pol.filter(q => q.CancellationPrice === 0).pop();
        const k = [j.scn, h.HotelId, sid, r0.MappedMealName, cls].join('|');

        if (!AGG[k] || AGG[k].p > p) {
          AGG[k] = {
            scn: j.scn,
            hid: String(h.HotelId),
            sid,
            meal: r0.MappedMealName,
            cls,
            p,
            room: r0.RoomTypeName,
            free: fr ? fr.ToDate : '',
            cur
          };
        }
      });
    });
  });
}
async function one(j,hd,to){j.st='run';j.err='';const ac=new AbortController(),t=setTimeout(()=>ac.abort(),to);
try{const r=await fetch(W+'/proxy',{method:'POST',signal:ac.signal,headers:{Authorization:'Bearer '+TOK,'Content-Type':'application/json'},body:JSON.stringify({url:$('#url').value,method:'POST',headers:hd,body:body(j),timeout:to})});
const x=await r.json().catch(()=>null);
if(r.status===401){j.st='fail';j.err='Unauthorized, login again'}
else if(!r.ok||!x||!x.AvailabilityRS){j.st='fail';j.err='HTTP '+r.status+' '+JSON.stringify(x&&x.Error||'')}
else{j.st='ok';j.key=x.AvailabilityRS.SearchKey;parse(j,x)}}
catch(e){j.st=e.name==='AbortError'?'timeout':'fail';j.err=String(e)}finally{clearTimeout(t);prog()}}
function prog(){const c=s=>JOBS.filter(j=>j.st===s).length;$('#pr').textContent=`Done ${c('ok')+c('fail')+c('timeout')}/${JOBS.length} | ok ${c('ok')} | timeout ${c('timeout')} | failed ${c('fail')}`}
async function run(list){stop=false;const iv=1000/+$('#qps').value,to=+$('#to').value*1000,hd=JSON.parse($('#hd').value||'{}'),fl=[];let nx=performance.now();
for(const j of list){if(stop)break;const w=nx-performance.now();if(w>0)await sleep(w);fl.push(one(j,hd,to));nx=Math.max(nx,performance.now())+iv}
await Promise.all(fl);dash()}
$('#go').onclick=()=>{if(!H.length||!$('#url').value)return alert('Upload hotels and set the endpoint first');JOBS=build();if(!JOBS.length)return alert('Set a check-in date');AGG={};run(JOBS)};
$('#sp').onclick=()=>stop=true;
$('#rt').onclick=()=>run(JOBS.filter(j=>j.st==='timeout'||j.st==='fail'));
function compare(){const mp=$('#ml').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean),base=$('#mode').value==='map'?$('#b0').value:null,t=+$('#tg').value/100,G={};
Object.values(AGG).forEach(a=>{if(!sup(a.sid).on||(mp.length&&!mp.includes((a.meal||'').toLowerCase())))return;const k=[a.scn,a.hid,a.meal,a.cls].join('|');(G[k]=G[k]||[]).push(a)});
const rows=[],V={};
for(const k in G){const r=G[k].sort((a,b)=>a.p-b.p),lo=r[0],hi=r[r.length-1],h=HM[lo.hid]||{};let v='n/a',bp='',adj='',ot=null,df='',pc='';
if(base){const b=r.find(x=>x.sid===base),os=r.filter(x=>x.sid!==base);ot=os[0];if(b){bp=b.p/100;adj=+(bp*(1-t)).toFixed(2)}
if(b&&!ot)v='Base only';else if(!b&&ot)v='Others only';else{const d=adj-ot.p/100;v=Math.abs(d)<=.01?'Identical':d<0?'Base cheaper':'Base more expensive';df=+d.toFixed(2);pc=+(d/(ot.p/100)*100).toFixed(2)}V[v]=(V[v]||0)+1}
rows.push({Scenario:lo.scn,HotelId:lo.hid,Hotel:h.name,Country:h.country,Meal:lo.meal,Cancellation:lo.cls,Verdict:v,BasePrice:bp,AdjustedBase:adj,BestOtherSupplier:ot?sup(ot.sid).name:'',BestOtherPrice:ot?ot.p/100:'',DiffUSD:df,DiffPct:pc,CheapestSupplier:sup(lo.sid).name,CheapestPrice:lo.p/100,MostExpensiveSupplier:sup(hi.sid).name,MostExpensivePrice:hi.p/100,Suppliers:r.length})}
const c=s=>JOBS.filter(j=>j.st===s).length,okH=new Set(),av=new Set(Object.values(AGG).map(a=>a.hid));JOBS.filter(j=>j.st==='ok').forEach(j=>j.hs.forEach(h=>okH.add(h.id)));
const sum={'Hotels uploaded':H.length,'API calls':JOBS.length,'Successful':c('ok'),'Failed':c('fail'),'Timed out':c('timeout'),'Hotels with rates':av.size,'Hotels without availability':[...okH].filter(x=>!av.has(x)).length,...Object.fromEntries(Object.entries(V).map(([k,v])=>['Comparisons: '+k,v]))};
return{rows,sum}}
function dash(){prog();$('#db').innerHTML=Object.entries(compare().sum).map(([k,v])=>`<div><span class="m">${k}</span><b>${v}</b></div>`).join('')}
$('#xl').onclick=()=>{const R=compare(),wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a.length?a:[{Note:'No data'}]),n);
add('Summary',Object.entries(R.sum).map(([k,v])=>({Metric:k,Value:v})));add('Mapping',R.rows);
add('Rates',Object.values(AGG).map(a=>({Scenario:a.scn,HotelId:a.hid,Hotel:(HM[a.hid]||{}).name,Country:(HM[a.hid]||{}).country,SupplierId:a.sid,Supplier:sup(a.sid).name,Meal:a.meal,Cancellation:a.cls,FreeCancelUntil:a.free,Room:a.room,Price:a.p/100,Currency:a.cur})));
add('Requests',JOBS.map(j=>({Scenario:j.scn,Nationality:j.nat,HotelIds:j.hs.map(h=>h.id).join(','),Status:j.st,Error:j.err||'',SearchKey:j.key||''})));
XLSX.writeFile(wb,'Trinetra_'+new Date().toISOString().slice(0,16).replace(/\D/g,'')+'.xlsx')};
boot();
</script></main></body></html>
